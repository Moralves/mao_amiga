spring.application.name=instituto-api
server.port=8080

# Banco de dados H2 gravando em arquivo
spring.datasource.url=jdbc:h2:file:./data/institutodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Paginação no formato content + page
spring.data.web.pageable.serialization-mode=via_dto

# Exibir mensagens de erro e validação claramente nas respostas 400 e 404
server.error.include-message=always
server.error.include-binding-errors=always
